<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYRACUSE UNITED</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Times New Roman', Times, serif, sans-serif;
    }

    body {
      background-color: #d6d6d6;
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #273527;
      color: #ffffff;
      padding: 15px 20px;
      text-align: center;
    }

    .brand-title {
      font-size: 1.2rem;
      letter-spacing: 2px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px; 
    }

    .brand-logo {
      width: 100px;       
      height: 45px;       
      border-radius: 10%; 
      object-fit: cover;
    }

    nav {
      background-color: #262c26;
      padding: 8px 0;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 30px;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-size: 0.85rem;
      letter-spacing: 1px;
      font-weight: bold;
    }

    nav a.active, nav a:hover {
      color: #f8f5f5;
      border-bottom: 2px solid #ffffff;
      padding-bottom: 2px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 30px;
    }

    .card {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 50px;
      max-width: 1300px;
      width: 300%; 
      text-align: center;
      box-shadow: 0 10px 25px rgba(31, 153, 6, 0.2);
    }

    .card h1 {
      font-size: 1.5rem;
      letter-spacing: 1.5px;
      color: #2a3028;
      margin-bottom: 35px;
    }

    .avatar-group {
      display: flex;
      justify-content: center;
      gap: 160px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .avatar-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .avatar {
      width: 115px;
      height: 115px;
      border-radius: 50%;
      object-fit: cover;
      background-color: #cbd2c8;
      border: 2px solid #a3ae9f;
      margin-bottom: 8px;
    }
    .avatar-name {
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 1px;
      color: #2a3028;
    }

    .description {
      font-size: 0.85rem;
      color: #242323;
      line-height: 1.5;
      margin-top: 10px;
    }

    footer {
      background-color: #151d12;
      color: #c2c9bf;
      text-align: center;
      padding: 12px;
      font-size: 0.75rem;
    }
  </style>
</head>

</html>
